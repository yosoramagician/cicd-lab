name: CI 112062315

on:
    push:
        branches:
            - "**"
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "22"

            - name: Install dependencies
              run: npm ci

            - name: TypeScript Typecheck
              run: npm run typecheck

            - name: Prettier Check
              run: npm run format:check

            - name: Run tests
              run: |
                  mkdir -p reports
                  npm test -- --run --reporter=default --reporter=junit --outputFile=reports/vitest-junit.xml

            - name: Upload test report artifact
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test-report
                  path: reports/
                  if-no-files-found: error